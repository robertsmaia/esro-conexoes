# Blueprint do Render: New → Blueprint → aponte para o repositório com esta pasta.
services:
  - type: web
    name: esro-conexoes
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: MCP_SECRET
        generateValue: true
      - key: WA_MODE
        value: meta
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: IG_TOKEN
        sync: false
      - key: IG_USER_ID
        value: me
      - key: IG_APP_SECRET
        sync: false
      - key: IG_VERIFY_TOKEN
        generateValue: true
      - key: SITE_WEBHOOK_TOKEN
        generateValue: true
