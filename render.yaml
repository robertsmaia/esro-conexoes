# Blueprint do Render: New → Blueprint → aponte para o repositório com esta pasta.
services:
  - type: web
    name: esro-conexoes
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: MCP_SECRET
        generateValue: true
      - key: PAINEL_SENHA
        sync: false
      - key: WA_MODE
        value: meta
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: IG_TOKEN
        sync: false
      - key: IG_USER_ID
        value: me
      - key: IG_APP_SECRET
        sync: false
      - key: IG_VERIFY_TOKEN
        generateValue: true
      - key: SITE_WEBHOOK_TOKEN
        generateValue: true
      # Loja online (opcionais; veja PASSO-A-PASSO-LOJA.md)
      - key: PUBLIC_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_OWNER
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ME_TOKEN
        sync: false
